stacks: 
  - name: Alice
    qdevice_typ: generic
    qdevice_cfg: 
      num_qubits: 20
  
  - name: Bob
    qdevice_typ: generic
    qdevice_cfg: 
      num_qubits: 20

links:
  - stack1: Alice
    stack2: Bob
    typ: perfect
    cfg: 
      state_delay: 1000 #nanosecs

clinks:
  - stack1: Alice
    stack2: Bob
    typ: default
    cfg: 
      delay: 100 #nanosecs